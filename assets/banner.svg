<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="design-md-extractor: URL in, DESIGN.md out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#171b2e"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <clipPath id="win"><rect x="760" y="70" width="440" height="280" rx="16"/></clipPath>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',Consolas,Menlo,monospace}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
      @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      .dash{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="980" cy="210" r="300" fill="url(#glow)" class="pulse"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="url(#g)" stroke-opacity=".55" stroke-width="2"/>

  <!-- LEFT: logo + title -->
  <g class="rise" style="animation-delay:.1s">
    <g transform="translate(64 78) scale(.78)">
      <rect width="128" height="128" rx="28" fill="#0b0d12"/>
      <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#gv)" stroke-width="3"/>
      <rect x="22" y="30" width="84" height="70" rx="10" fill="#141824" stroke="url(#gv)" stroke-width="3"/>
      <path d="M22 46h84" stroke="url(#gv)" stroke-width="3"/>
      <circle cx="33" cy="38" r="3" fill="#7c5cff"/><circle cx="43" cy="38" r="3" fill="#22d3ee"/><circle cx="53" cy="38" r="3" fill="#a3e635"/>
      <rect x="32" y="56" width="14" height="14" rx="4" fill="#7c5cff"/><rect x="52" y="56" width="14" height="14" rx="4" fill="#22d3ee"/><rect x="72" y="56" width="14" height="14" rx="4" fill="#a3e635"/>
      <path d="M32 82h30M32 90h46" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
      <path d="M90 78v14m-7-7l7 7 7-7" fill="none" stroke="url(#gv)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="64" y="232" class="t rise" style="animation-delay:.3s" font-size="54" font-weight="800" fill="#fff" letter-spacing="-1.5">design-md<tspan fill="url(#g)">-extractor</tspan></text>
  <text x="66" y="276" class="t rise" style="animation-delay:.5s" font-size="24" fill="#9ca3af">Paste a URL. Get a measured <tspan fill="#e5e7eb" font-weight="600">DESIGN.md</tspan>.</text>

  <!-- pills -->
  <g class="t" font-size="15" font-weight="600">
    <g class="rise" style="animation-delay:.8s"><rect x="64" y="306" width="116" height="34" rx="17" fill="#7c5cff" fill-opacity=".16" stroke="#7c5cff" stroke-opacity=".6"/><text x="122" y="328" text-anchor="middle" fill="#c4b5fd">Claude Code</text></g>
    <g class="rise" style="animation-delay:.95s"><rect x="190" y="306" width="84" height="34" rx="17" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".6"/><text x="232" y="328" text-anchor="middle" fill="#67e8f9">Codex</text></g>
    <g class="rise" style="animation-delay:1.1s"><rect x="284" y="306" width="124" height="34" rx="17" fill="#a3e635" fill-opacity=".13" stroke="#a3e635" stroke-opacity=".55"/><text x="346" y="328" text-anchor="middle" fill="#bef264">Antigravity</text></g>
    <g class="rise" style="animation-delay:1.25s"><rect x="418" y="306" width="84" height="34" rx="17" fill="#f472b6" fill-opacity=".13" stroke="#f472b6" stroke-opacity=".55"/><text x="460" y="328" text-anchor="middle" fill="#f9a8d4">Cursor</text></g>
  </g>
  <text x="64" y="382" class="m rise" style="animation-delay:1.4s" font-size="15" fill="#6b7280">MIT · by Suhail Khan</text>

  <!-- RIGHT: browser being scanned -->
  <g class="float">
    <rect x="760" y="70" width="440" height="280" rx="16" fill="#0f1220" stroke="url(#g)" stroke-width="2.5"/>
    <path d="M760 106h440" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="782" cy="88" r="5" fill="#f87171"/><circle cx="800" cy="88" r="5" fill="#fbbf24"/><circle cx="818" cy="88" r="5" fill="#4ade80"/>
    <rect x="850" y="79" width="320" height="18" rx="9" fill="#ffffff" fill-opacity=".07"/>
    <text x="866" y="93" class="m" font-size="11" fill="#9ca3af">https://your-favorite-site.com</text>

    <!-- hero wireframe -->
    <rect x="788" y="128" width="190" height="16" rx="5" fill="#e5e7eb" fill-opacity=".85"/>
    <rect x="788" y="152" width="140" height="16" rx="5" fill="#e5e7eb" fill-opacity=".55"/>
    <rect x="788" y="182" width="250" height="8" rx="4" fill="#9ca3af" fill-opacity=".5"/>
    <rect x="788" y="198" width="210" height="8" rx="4" fill="#9ca3af" fill-opacity=".5"/>
    <rect x="788" y="226" width="96" height="34" rx="10" fill="url(#gv)"/>
    <rect x="894" y="226" width="96" height="34" rx="10" fill="none" stroke="#9ca3af" stroke-opacity=".6"/>
    <rect x="1070" y="128" width="104" height="132" rx="14" fill="#1b2036" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="788" y="282" width="118" height="52" rx="12" fill="#1b2036" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="918" y="282" width="118" height="52" rx="12" fill="#1b2036" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="1048" y="282" width="126" height="52" rx="12" fill="#1b2036" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- measuring outlines that blink on as the scan passes -->
    <rect x="786" y="124" width="196" height="48" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.5" class="dash"/>
    <rect x="786" y="224" width="100" height="38" rx="12" fill="none" stroke="#a3e635" stroke-width="1.5" class="dash"/>
    <rect x="1068" y="126" width="108" height="136" rx="16" fill="none" stroke="#f472b6" stroke-width="1.5" class="dash"/>

    <!-- scan line -->
    <g clip-path="url(#win)">
      <rect x="760" y="-40" width="440" height="40" fill="url(#scan)">
        <animate attributeName="y" values="70;350;70" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      </rect>
      <rect x="760" y="0" width="440" height="2" fill="#22d3ee">
        <animate attributeName="y" values="108;348;108" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      </rect>
    </g>
  </g>

  <!-- extracted tokens popping out -->
  <g>
    <g class="pop" style="animation-delay:1.6s"><circle cx="1224" cy="120" r="14" fill="#7c5cff"/></g>
    <g class="pop" style="animation-delay:1.8s"><circle cx="1224" cy="164" r="14" fill="#22d3ee"/></g>
    <g class="pop" style="animation-delay:2.0s"><circle cx="1224" cy="208" r="14" fill="#a3e635"/></g>
    <g class="pop" style="animation-delay:2.2s"><circle cx="1224" cy="252" r="14" fill="#f472b6"/></g>
    <g class="pop" style="animation-delay:2.4s"><circle cx="1224" cy="296" r="14" fill="#fbbf24"/></g>
  </g>
  <text x="1216" y="385" text-anchor="end" class="m" font-size="14" fill="#6b7280">tokens · states · layout · architecture<tspan class="blink" fill="#22d3ee"> ▍</tspan></text>
</svg>
