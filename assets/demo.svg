<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Terminal demo of design-md-extractor">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <style>
      .m{font-family:'JetBrains Mono','SF Mono',Consolas,Menlo,monospace;font-size:16px}
      .l{opacity:0}
      .a1{animation:show 14s infinite 0.3s}.a2{animation:show 14s infinite 2s}.a3{animation:show 14s infinite 3.4s}
      .a4{animation:show 14s infinite 4.4s}.a5{animation:show 14s infinite 5.4s}.a6{animation:show 14s infinite 6.4s}
      .a7{animation:show 14s infinite 7.6s}.a8{animation:show 14s infinite 9s}.a9{animation:show 14s infinite 10s}
      @keyframes show{0%{opacity:0;transform:translateX(-6px)}3%{opacity:1;transform:none}92%{opacity:1}97%,100%{opacity:0}}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.l{opacity:1}}
    </style>
  </defs>
  <rect width="900" height="400" rx="16" fill="#0b0d12"/>
  <rect x="1" y="1" width="898" height="398" rx="15" fill="none" stroke="url(#g)" stroke-opacity=".6" stroke-width="2"/>
  <path d="M0 44h900" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="26" cy="22" r="6" fill="#f87171"/><circle cx="48" cy="22" r="6" fill="#fbbf24"/><circle cx="70" cy="22" r="6" fill="#4ade80"/>
  <text x="450" y="27" text-anchor="middle" class="m" font-size="13" fill="#6b7280">design-md-extractor · illustrative session</text>

  <g class="m">
    <text x="28" y="84"  class="l a1" fill="#e5e7eb"><tspan fill="#22d3ee">&gt;</tspan> Create a DESIGN.md from https://your-favorite-site.com</text>
    <text x="28" y="122" class="l a2" fill="#9ca3af">● Running extractor (Chromium, 4 viewports, dark mode)</text>
    <text x="28" y="152" class="l a3" fill="#a3e635">✓ <tspan fill="#e5e7eb">47 colors, 11 CSS variables, 7 type styles measured</tspan></text>
    <text x="28" y="182" class="l a4" fill="#a3e635">✓ <tspan fill="#e5e7eb">buttons / inputs / cards with hover, focus, active, disabled</tspan></text>
    <text x="28" y="212" class="l a5" fill="#a3e635">✓ <tspan fill="#e5e7eb">breakpoints 768 / 1024, mobile and dark-mode diffs</tspan></text>
    <text x="28" y="242" class="l a6" fill="#a3e635">✓ <tspan fill="#e5e7eb">architecture: Next.js [high] · Tailwind [high] · Vercel [high]</tspan></text>
    <text x="28" y="272" class="l a7" fill="#a3e635">✓ <tspan fill="#e5e7eb">rebuild verified against screenshots at 1440 and 390</tspan></text>
    <text x="28" y="316" class="l a8" fill="#c4b5fd">★ DESIGN.md written <tspan fill="#6b7280">(13 sections, paste-ready :root tokens)</tspan></text>
    <text x="28" y="356" class="l a9" fill="#6b7280"><tspan fill="#22d3ee">&gt;</tspan> <tspan class="caret" fill="#22d3ee">▍</tspan></text>
  </g>
</svg>
