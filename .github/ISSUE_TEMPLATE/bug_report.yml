name: Bug report
description: The DESIGN.md or extractor output does not match the real site
labels: [bug]
body:
  - type: input
    id: url
    attributes: { label: URL (or minimal HTML), placeholder: "https://example.com" }
    validations: { required: true }
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Claude Code, Codex, Antigravity, Cursor, Plain node command]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "Versions (node, playwright, skill)", placeholder: "node 22, playwright 1.63, skill 1.0.0" }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual, description: "Which value is wrong? Give the real value and what the digest reported." }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: Relevant digest.md or error output, render: text }
